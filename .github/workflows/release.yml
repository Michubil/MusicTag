name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      ACOUSTID_CLIENT_KEY: ${{ secrets.ACOUSTID_CLIENT_KEY }}
    outputs:
      version: ${{ steps.config.outputs.version }}
    defaults:
      run:
        shell: pwsh -NoProfile -Command "{0}"
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release source and read build configuration
        id: config
        run: |
          . .\scripts\BuildSupport.ps1
          $settings = getBuildSettings
          if ($env:GITHUB_REF_NAME -cne "v$($settings.Version)") {
            throw 'The tag must match versionName in app/build.gradle.kts.'
          }
          if ([string]::IsNullOrWhiteSpace($env:ACOUSTID_CLIENT_KEY)) {
            throw 'Set the ACOUSTID_CLIENT_KEY repository secret before releasing audio fingerprint lookup.'
          }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The Release tag must point to a commit on main.' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "java-version=$($settings.JavaVersion)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$($settings.Version)"
          $signingKey = Join-Path $env:RUNNER_TEMP 'musictag-signing.keystore'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MUSICTAG_KEYSTORE_PATH=$signingKey"

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: ${{ steps.config.outputs.java-version }}

      - name: Prepare Android SDK
        run: .\scripts\prepare-ci.ps1

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSICTAG_KEYSTORE_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            throw 'Set the MUSICTAG_KEYSTORE_BASE64 repository secret to the existing signing key.'
          }
          [IO.File]::WriteAllBytes(
            $env:MUSICTAG_KEYSTORE_PATH,
            [Convert]::FromBase64String($env:KEYSTORE_BASE64)
          )

      - name: Build and verify release APK
        run: .\scripts\build-apk.ps1 -SdkPath $env:ANDROID_HOME

      - name: Upload verified APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MusicTag-v${{ steps.config.outputs.version }}
          path: app/build/outputs/apk/release/MusicTag-v${{ steps.config.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove release signing key
        if: always()
        run: |
          if ($env:MUSICTAG_KEYSTORE_PATH -and (Test-Path -LiteralPath $env:MUSICTAG_KEYSTORE_PATH)) {
            Remove-Item -LiteralPath $env:MUSICTAG_KEYSTORE_PATH -Force
          }

      - name: Upload failed build reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Build-reports
          path: |
            app/build/reports/
            core/designsystem/build/reports/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish verified Release
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      APK_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: MusicTag-v${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/release-apk

      - name: Publish Release with APK
        shell: pwsh -NoProfile -Command "{0}"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -cne "v$env:APK_VERSION") { throw 'Release tag does not match APK version.' }
          $name = "MusicTag-v$env:APK_VERSION.apk"
          $apk = Join-Path $env:RUNNER_TEMP "release-apk\$name"
          if (-not (Test-Path -LiteralPath $apk -PathType Leaf)) { throw 'Verified APK is missing.' }
          $releaseJson = gh release view $env:RELEASE_TAG --repo $env:GH_REPO --json assets,isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if ($release.assets | Where-Object { $_.name -ceq $name }) {
              throw 'This Release already has the named APK. Check it before rerunning publication.'
            }
            gh release upload $env:RELEASE_TAG $apk --repo $env:GH_REPO
            if ($LASTEXITCODE -ne 0) { throw 'Release APK upload failed.' }
            if ($release.isDraft) {
              gh release edit $env:RELEASE_TAG --repo $env:GH_REPO --draft=false
              if ($LASTEXITCODE -ne 0) { throw 'Release draft could not be published.' }
            }
          } else {
            gh release create $env:RELEASE_TAG $apk --repo $env:GH_REPO --verify-tag --generate-notes --title $env:APK_VERSION
            if ($LASTEXITCODE -ne 0) { throw 'Release creation or APK upload failed.' }
          }
