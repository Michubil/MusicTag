name: Build APK

on:
  release:
    types: [published]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Bookmark rewrites supersede PR checks; each packaging run stays independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      version: ${{ steps.config.outputs.version }}
    defaults:
      run:
        shell: pwsh -NoProfile -Command "{0}"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read build configuration
        id: config
        run: |
          . .\scripts\BuildSupport.ps1
          $settings = getBuildSettings
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$($settings.Version)") {
            throw 'The tag must match versionName in app/build.gradle.kts.'
          }
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'The Release tag must point to a commit on main.' }
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "java-version=$($settings.JavaVersion)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$($settings.Version)"
          $signingKey = Join-Path $env:RUNNER_TEMP 'musictag-signing.keystore'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MUSICTAG_KEYSTORE_PATH=$signingKey"

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: ${{ steps.config.outputs.java-version }}

      - name: Prepare Android SDK
        run: .\scripts\prepare-ci.ps1

      - name: Check source, tests and lint
        run: .\scripts\test.ps1 -SdkPath $env:ANDROID_HOME

      - name: Restore release signing key
        id: signing
        if: github.event_name == 'release' && github.event.action == 'published'
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSICTAG_KEYSTORE_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            throw 'Set the MUSICTAG_KEYSTORE_BASE64 repository secret to the existing signing key.'
          }
          [IO.File]::WriteAllBytes(
            $env:MUSICTAG_KEYSTORE_PATH,
            [Convert]::FromBase64String($env:KEYSTORE_BASE64)
          )

      - name: Build and verify release APK
        id: apk
        if: steps.signing.outcome == 'success'
        run: .\scripts\build-apk.ps1 -SdkPath $env:ANDROID_HOME

      - name: Upload APK
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MusicTag-v${{ steps.config.outputs.version }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove release signing key
        if: always()
        run: |
          if ($env:MUSICTAG_KEYSTORE_PATH -and (Test-Path -LiteralPath $env:MUSICTAG_KEYSTORE_PATH)) {
            Remove-Item -LiteralPath $env:MUSICTAG_KEYSTORE_PATH -Force
          }

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Check-reports
          path: |
            app/build/reports/
            app/build/test-results/
            core/designsystem/build/reports/
            core/designsystem/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Attach APK to Release
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      APK_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download verified APK and attach to Release
        shell: pwsh -NoProfile -Command "{0}"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -cne "v$env:APK_VERSION") { throw 'Release tag does not match APK version.' }
          $directory = Join-Path $env:RUNNER_TEMP 'release-apk'
          gh run download $env:GITHUB_RUN_ID --repo $env:GH_REPO --name "MusicTag-v$env:APK_VERSION" --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'APK artifact download failed.' }
          $name = "MusicTag-v$env:APK_VERSION.apk"
          $apk = Join-Path $directory $name
          if (-not (Test-Path -LiteralPath $apk -PathType Leaf)) { throw 'Verified APK is missing.' }
          $releaseJson = gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release lookup failed.' }
          $release = $releaseJson | ConvertFrom-Json
          $existing = $release.assets | Where-Object { $_.name -ceq $name }
          if ($existing) {
            $digest = 'sha256:' + (Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($existing.digest -ne $digest) { throw 'A different APK already exists on this Release.' }
            Write-Output 'The same APK is already attached.'
          } else {
            gh release upload $env:RELEASE_TAG $apk --repo $env:GH_REPO
            if ($LASTEXITCODE -ne 0) { throw 'Release APK upload failed.' }
          }
